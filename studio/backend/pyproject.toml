[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgstudio"
version = "0.2.0"
description = "Step-by-step web UI and hybrid AutoSchemaKG + SocraticKG knowledge-graph builder"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # AutoSchemaKG (https://github.com/HKUST-KnowComp/AutoSchemaKG), installed from PyPI
    "atlas-rag==0.0.5.post1",
    "faiss-cpu",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "networkx>=3.1",
    "json_repair",
    "pydantic>=2",
    "pypdf>=4",
    "python-multipart",
    "numpy",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "rdflib>=7"]  # rdflib: validates the JSON-LD export

[project.scripts]
kgstudio = "kgstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["kgstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
